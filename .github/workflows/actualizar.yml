name: Actualizar ventas desde Gescom

on:
  schedule:
    - cron: '0 10 * * 1-5'    # 10:00 UTC = 07:00 hora argentina, lunes a viernes
    - cron: '30 16 * * 1-5'   # 16:30 UTC = 13:30 hora argentina, lunes a viernes
  workflow_dispatch:         # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar ventas de la base de Gescom y armar el CSV
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\actualizar.ps1 -Salida .

      - name: Subir el CSV nuevo
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv'
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Ventas actualizadas desde Gescom ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            git push
          fi
